<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Açık API'ler ve Google Fontları İçin Güvenli CSP -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    connect-src 'self' 
      https://*.wikipedia.org 
      https://openlibrary.org 
      https://gutendex.com 
      https://api.crossref.org 
      https://api.semanticscholar.org;
    img-src 'self' data: https:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  ">

  <title>Findex — Global Educational Resource Discovery</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --bg-gradient: radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                     radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.9);
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #8b5cf6;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 20px 30px -10px rgba(37, 99, 235, 0.12);
      
      --cat-wiki-bg: #e0f2fe;
      --cat-wiki-text: #0369a1;
      --cat-papers-bg: #f3e8ff;
      --cat-papers-text: #7e22ce;
      --cat-books-bg: #fef3c7;
      --cat-books-text: #b45309;
      --cat-ebooks-bg: #fce7f3;
      --cat-ebooks-text: #be185d;
      --cat-courses-bg: #ecfdf5;
      --cat-courses-text: #047857;
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --bg-gradient: radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
                     radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 45%);
      --surface: #131b2e;
      --surface-glass: rgba(19, 27, 46, 0.9);
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent: #a78bfa;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 20px 35px -5px rgba(59, 130, 246, 0.2);

      --cat-wiki-bg: rgba(3, 105, 161, 0.25);
      --cat-wiki-text: #38bdf8;
      --cat-papers-bg: rgba(126, 34, 206, 0.25);
      --cat-papers-text: #c084fc;
      --cat-books-bg: rgba(180, 83, 9, 0.25);
      --cat-books-text: #fbbf24;
      --cat-ebooks-bg: rgba(190, 24, 93, 0.25);
      --cat-ebooks-text: #f472b6;
      --cat-courses-bg: rgba(4, 120, 87, 0.25);
      --cat-courses-text: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body[dir="rtl"] {
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
    }

    /* Üst Menü */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--surface-glass);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 800;
      font-size: 1.35rem;
      text-decoration: none;
      color: var(--text);
      letter-spacing: -0.03em;
      cursor: pointer;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .glass-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease;
    }
    .btn-icon:hover { transform: scale(1.05); }

    /* Ana Bölüm */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
    }

    .hero-section {
      text-align: center;
      max-width: 780px;
      margin: 1.5rem auto 2.5rem;
      transition: margin 0.3s ease;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.2);
      color: var(--primary);
      font-size: 0.825rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
    }

    .hero-title {
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--text) 40%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      line-height: 1.6;
      margin-bottom: 2rem;
      padding: 0 0.5rem;
    }

    /* Arama Çubuğu */
    .search-container {
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.45rem 0.5rem 0.45rem 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-container:focus-within {
      border-color: var(--primary);
      box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.2);
    }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.65rem 0.25rem;
      font-size: 1.05rem;
      color: var(--text);
      outline: none;
      font-family: inherit;
      min-width: 0;
    }

    .search-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn-search {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      border: none;
      padding: 0.8rem 1.6rem;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: transform 0.15s ease, opacity 0.2s;
      white-space: nowrap;
    }
    .btn-search:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    /* Geçmiş / Örnekler */
    .history-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.25rem;
      align-items: center;
      padding: 0 0.5rem;
    }
    .history-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: rgba(37, 99, 235, 0.05);
    }
    .chip-clear {
      color: #ef4444;
      background: transparent;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 0.25rem;
    }

    /* Kategori Gezinme Çubuğu ve Hareket Tuşları */
    .tabs-nav-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
      width: 100%;
    }

    .tabs-scroll-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      z-index: 2;
    }
    .tabs-scroll-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      transform: scale(1.06);
    }
    .tabs-scroll-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
      transform: none;
    }

    .tabs-wrapper {
      flex: 1;
      display: flex;
      gap: 0.55rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding: 0.25rem 0.15rem;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tab-btn {
      padding: 0.55rem 1.1rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .tab-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .tab-btn.active .tab-badge {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .tab-badge {
      font-size: 0.725rem;
      padding: 0.1rem 0.5rem;
      border-radius: 9999px;
      background: var(--border);
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Kartlar Izgarası */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 1.25rem;
    }
    .result-card {
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .result-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(37, 99, 235, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      gap: 0.5rem;
    }
    .card-badge {
      font-size: 0.725rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .badge-wiki { background: var(--cat-wiki-bg); color: var(--cat-wiki-text); }
    .badge-papers { background: var(--cat-papers-bg); color: var(--cat-papers-text); }
    .badge-books { background: var(--cat-books-bg); color: var(--cat-books-text); }
    .badge-ebooks { background: var(--cat-ebooks-bg); color: var(--cat-ebooks-text); }
    .badge-courses { background: var(--cat-courses-bg); color: var(--cat-courses-text); }

    .card-source {
      font-size: 0.785rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.55rem;
      color: var(--text);
    }

    .card-desc {
      font-size: 0.865rem;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 1.15rem;
      flex-grow: 1;
    }

    /* Kart Altı */
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
      gap: 0.5rem;
    }
    .card-metrics {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .meta-star {
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .meta-year {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .btn-examine {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.95rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-examine:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    /* Durum Alanı ve Butonlar */
    .status-box {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-loadmore {
      display: block;
      margin: 2.5rem auto 1rem;
      padding: 0.85rem 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }
    .btn-loadmore:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Mobil Uyum Kuralları (< 640px) */
    @media (max-width: 640px) {
      header {
        padding: 0.75rem 1rem;
      }
      .brand {
        font-size: 1.2rem;
      }
      .brand-icon {
        width: 32px;
        height: 32px;
      }
      main {
        padding: 1.5rem 0.85rem;
      }
      .hero-section {
        margin: 0.5rem auto 2rem;
      }
      .search-container {
        border-radius: 20px;
        flex-direction: column;
        align-items: stretch;
        padding: 0.75rem;
        gap: 0.65rem;
      }
      .search-input {
        padding: 0.4rem 0.2rem;
        font-size: 1rem;
      }
      .search-controls {
        display: flex;
        width: 100%;
        gap: 0.5rem;
      }
      .search-controls .glass-select {
        flex: 1;
        text-align: center;
      }
      .btn-search {
        flex: 2;
        justify-content: center;
        padding: 0.75rem 1rem;
      }
      .tabs-scroll-btn {
        width: 32px;
        height: 32px;
      }
    }

<body>

  <!-- Başlık Çubuğu -->
  <header>
    <a href="#" class="brand" onclick="resetApp()">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      Findex
    </a>

    <div class="header-actions">
      <!-- 7 Dilli Arayüz Seçici -->
      <select id="uiLangSelect" class="glass-select" onchange="changeUILang(this.value)">
        <option value="tr" selected>🇹🇷 TR</option>
        <option value="en">🇬🇧 EN</option>
        <option value="es">🇪🇸 ES</option>
        <option value="de">🇩🇪 DE</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="ru">🇷🇺 RU</option>
        <option value="ar">🇸🇦 AR</option>
      </select>

      <!-- Açık / Koyu Tema Butonu -->
      <button class="btn-icon" id="themeBtn" onclick="toggleTheme()" title="Temayı Değiştir">
        🌙
      </button>
    </div>
  </header>

  <!-- Ana İçerik -->

        }
      } catch (e) {

      }

    function scrollTabs(amount) {
      const tabs = document.getElementById("categoryTabs");
      const isRTL = document.body.getAttribute("dir") === "rtl";
      const scrollDirection = isRTL ? -amount : amount;
      tabs.scrollBy({ left: scrollDirection, behavior: "smooth" });
    }

    function updateTabScrollButtons() {
      const tabs = document.getElementById("categoryTabs");
      const leftBtn = document.getElementById("tabsScrollLeft");
      const rightBtn = document.getElementById("tabsScrollRight");
      if (!tabs || !leftBtn || !rightBtn) return;

      const maxScroll = tabs.scrollWidth - tabs.clientWidth;
      if (maxScroll <= 5) {
        leftBtn.style.opacity = "0.3";
        leftBtn.disabled = true;
        rightBtn.style.opacity = "0.3";
        rightBtn.disabled = true;
        return;
      }

      const isRTL = document.body.getAttribute("dir") === "rtl";
      const currentScroll = Math.abs(tabs.scrollLeft);

      if (!isRTL) {
        leftBtn.disabled = currentScroll <= 5;
        rightBtn.disabled = currentScroll >= maxScroll - 5;
      } else {
        rightBtn.disabled = currentScroll <= 5;
        leftBtn.disabled = currentScroll >= maxScroll - 5;
      }
    }

    async function fetchWikipedia(q, lang, offset = 0) {
      try {
        const url = `https://${encodeURIComponent(lang)}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&sroffset=${offset}&srlimit=20&format=json&origin=*`;
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.query?.search || []).map((s, idx) => {
          const tmp = document.createElement("div");
          tmp.innerHTML = s.snippet || "";
          const textSnippet = tmp.textContent || tmp.innerText || "";
          return {
            id: `wiki_${offset}_${idx}`,
            category: "wiki",
            badgeText: "WİKİ",
            badgeClass: "badge-wiki",
            source: `Wikipedia (${lang.toUpperCase()})`,
            title: s.title,
            desc: textSnippet ? textSnippet + "..." : "Ansiklopedik konu açıklaması ve detaylı kaynakça.",
            rating: "4.8",
            year: "2026",
            url: `https://${encodeURIComponent(lang)}.wikipedia.org/wiki/${encodeURIComponent(s.title)}`
          };
        });
      } catch (e) { return []; }
    }

    async function fetchCrossRef(q, offset = 0) {
      try {
        const url = `https://api.crossref.org/works?query=${encodeURIComponent(q)}&rows=20&offset=${offset}&select=DOI,title,abstract,author,issued,URL`;
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.message?.items || []).map((item, idx) => {
          const title = item.title && item.title.length > 0 ? item.title[0] : "Akademik Yayın";
          const year = item.issued?.["date-parts"]?.[0]?.[0] || "2025";
          const author = item.author && item.author[0] ? `${item.author[0].family || ''} ${item.author[0].given || ''}`.trim() : "Hakemli Makale";
          
          let desc = item.abstract ? item.abstract.replace(/<\/?[^>]+(>|$)/g, "") : `Akademik araştırma bildirisi. Yazar(lar): ${author}. DOI kaydı mevcuttur.`;
          if (desc.length > 175) desc = desc.substring(0, 172) + "...";

          return {
            id: `paper_${offset}_${idx}`,
            category: "papers",
            badgeText: "PAPERS",
            badgeClass: "badge-papers",
            source: "CrossRef Academic / DOI",
            title: title,
            desc: desc,
            rating: "4.9",
            year: String(year),
            url: item.URL || (item.DOI ? `https://doi.org/${item.DOI}` : "https://crossref.org")
          };
        });
      } catch (e) { return []; }
    }

    async function fetchOpenLibrary(q, page = 1) {
      try {
        const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&page=${page}&limit=15`;
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.docs || []).map((b, idx) => {
          const authors = Array.isArray(b.author_name) ? b.author_name.slice(0, 2).join(", ") : "Bilinmiyor";
          return {
            id: `book_${page}_${idx}`,
            category: "books",
            badgeText: "BOOKS",
            badgeClass: "badge-books",
            source: "Open Library Catalog",
            title: b.title || "Kitap",
            desc: `Yazar: ${authors} • İlk Basım: ${b.first_publish_year || "N/A"} • Yayıncı: ${b.publisher ? b.publisher[0] : "Genel Yayın"}`,
            rating: "4.8",
            year: b.first_publish_year ? String(b.first_publish_year) : "2024",
            url: b.key ? `https://openlibrary.org${b.key}` : "https://openlibrary.org"
          };
        });
      } catch (e) { return []; }
    }

    async function fetchGutendex(q, page = 1) {
      try {
        const url = `https://gutendex.com/books/?search=${encodeURIComponent(q)}&page=${page}`;
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.results || []).slice(0, 15).map((book, idx) => {
          const author = book.authors && book.authors[0] ? book.authors[0].name : "Klasik Yazar";
          const readUrl = book.formats["text/html"] || book.formats["application/epub+zip"] || `https://www.gutenberg.org/ebooks/${book.id}`;
          return {
            id: `ebook_${page}_${idx}`,
            category: "ebooks",
            badgeText: "E-BOOKS",
            badgeClass: "badge-ebooks",
            source: "Project Gutenberg (Ücretsiz)",
            title: book.title,
            desc: `Yazar: ${author} • İndirilme: ${book.download_count} • Telifsiz tam metin açık e-kitap.`,
            rating: "4.9",
            year: "Klasik",
            url: readUrl
          };
        });
      } catch (e) { return []; }
    }

          category: "courses",
          badgeText: "COURSES",
          badgeClass: "badge-courses",
          source: "Semantic Scholar",
          title: `${q} — AI Destekli Akademik Literatür Grafiği`,
          desc: "Milyonlarca bilimsel makalenin atıf haritaları, yapay zekâ özetleri ve açık erişim tam metinleri.",
          rating: "4.9",
          year: "2026",
          url: `https://www.semanticscholar.org/search?q=${enc}`
        },
        {
          id: `course_7_${enc}`,
          category: "courses",
          badgeText: "COURSES",
          badgeClass: "badge-courses",
          source: "Open Education Consortium",
          title: `${q} — Global Açık Lisanslı Eğitim Kaynakları`,
          desc: "Dünya çapında üniversitelerin ortaklaşa sunduğu telifsiz ders materyalleri ve modülleri.",
          rating: "4.7",
          year: "2026",
          url: `https://www.oeglobal.org/?s=${enc}`
        },
        {
          id: `course_8_${enc}`,
          category: "courses",
          badgeText: "COURSES",
          badgeClass: "badge-courses",
          source: "Directory of Open Access Books (DOAB)",
          title: `${q} — DOAB Hakemli Açık Kitap Havuzu`,
          desc: "Akademik yayınevleri tarafından onaylanmış ve ücretsiz erişime açılmış hakemli dijital kitaplar.",
          rating: "4.8",
          year: "2026",
          url: `https://directory.doabooks.org/discover?query=${enc}`
        }
      ];
    }

    /* ========================================================
       4. ARAMA VE SAYFALAMA YÖNETİMİ
       ======================================================== */
    async function triggerSearch(keepQuery = false) {
      const input = document.getElementById("searchInput");
      const q = keepQuery ? currentQuery : input.value.trim();
      if (!q) return;

      currentQuery = q;
      input.value = q;
      addToHistory(q);

      paginationOffsets = { wiki: 0, papers: 0, books: 1, ebooks: 1 };

      document.getElementById("categoryNavContainer").style.display = "flex";
      const statusBox = document.getElementById("statusBox");
      statusBox.style.display = "block";
      statusBox.replaceChildren();

      const spinner = document.createElement("div");
      spinner.className = "spinner";
      const statusP = document.createElement("p");
      statusP.textContent = i18n[currentUILang].searching;
      statusBox.appendChild(spinner);
      statusBox.appendChild(statusP);

      document.getElementById("resultsGrid").replaceChildren();
      document.getElementById("loadMoreBtn").style.display = "none";

      const searchLang = document.getElementById("searchLang").value || "tr";

      const [wikiRes, crossRefRes, openLibRes, gutendexRes] = await Promise.allSettled([
        fetchWikipedia(q, searchLang, 0),
        fetchCrossRef(q, 0),
        fetchOpenLibrary(q, 1),
        fetchGutendex(q, 1)
      ]);

      const courses = buildOpenCourses(q);
      const wiki = wikiRes.status === "fulfilled" ? wikiRes.value : [];
      const papers = crossRefRes.status === "fulfilled" ? crossRefRes.value : [];
      const books = openLibRes.status === "fulfilled" ? openLibRes.value : [];
      const ebooks = gutendexRes.status === "fulfilled" ? gutendexRes.value : [];

      currentItems = [...wiki, ...papers, ...books, ...ebooks, ...courses];

      statusBox.style.display = "none";
      updateBadges();
      renderResults();

      setTimeout(updateTabScrollButtons, 50);

      document.getElementById("categoryNavContainer").scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function loadMore() {
      const btn = document.getElementById("loadMoreBtn");
      btn.textContent = "...";
      btn.disabled = true;

      const searchLang = document.getElementById("searchLang").value || "tr";
      paginationOffsets.wiki += 20;
      paginationOffsets.papers += 20;
      paginationOffsets.books += 1;
      paginationOffsets.ebooks += 1;

      const [wikiMore, papersMore, booksMore, ebooksMore] = await Promise.allSettled([
        fetchWikipedia(currentQuery, searchLang, paginationOffsets.wiki),
        fetchCrossRef(currentQuery, paginationOffsets.papers),
        fetchOpenLibrary(currentQuery, paginationOffsets.books),
        fetchGutendex(currentQuery, paginationOffsets.ebooks)
      ]);

      if (wikiMore.status === "fulfilled") currentItems.push(...wikiMore.value);
      if (papersMore.status === "fulfilled") currentItems.push(...papersMore.value);
      if (booksMore.status === "fulfilled") currentItems.push(...booksMore.value);
      if (ebooksMore.status === "fulfilled") currentItems.push(...ebooksMore.value);

      btn.textContent = i18n[currentUILang].load_more;
      btn.disabled = false;
      updateBadges();
      renderResults();
    }

    function updateBadges() {
      const counts = { all: currentItems.length, wiki: 0, papers: 0, books: 0, ebooks: 0, courses: 0 };
      currentItems.forEach(item => {
        if (counts[item.category] !== undefined) counts[item.category]++;
      });

      document.getElementById("count-all").textContent = counts.all;
      document.getElementById("count-wiki").textContent = counts.wiki;
      document.getElementById("count-papers").textContent = counts.papers;
      document.getElementById("count-books").textContent = counts.books;
      document.getElementById("count-ebooks").textContent = counts.ebooks;
      document.getElementById("count-courses").textContent = counts.courses;
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === cat);
      });
      renderResults();
    }

    /* ========================================================
       5. KART GÖRSELLEŞTİRME (DOM API)
       ======================================================== */
    function renderResults() {
      const grid = document.getElementById("resultsGrid");
      grid.replaceChildren();
      const dict = i18n[currentUILang] || i18n.tr;

      let list = currentItems;
      if (activeCategory !== "all") {
        list = currentItems.filter(item => item.category === activeCategory);
      }

      if (list.length === 0) {
        if (currentQuery) {
          const emptyDiv = document.createElement("div");
          emptyDiv.style.gridColumn = "1/-1";
          emptyDiv.style.textAlign = "center";
          emptyDiv.style.padding = "3rem 1rem";
          emptyDiv.style.color = "var(--text-muted)";
          emptyDiv.textContent = dict.no_results;
          grid.appendChild(emptyDiv);
        }
        document.getElementById("loadMoreBtn").style.display = "none";
        return;
      }

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "result-card";

        const topContainer = document.createElement("div");

        // Rozet ve Kaynak
        const cardTop = document.createElement("div");
        cardTop.className = "card-top";

        const badge = document.createElement("span");
        badge.className = `card-badge ${item.badgeClass || ''}`;
        badge.textContent = item.badgeText || item.category.toUpperCase();

        const source = document.createElement("span");
        source.className = "card-source";
        source.textContent = item.source || "";

        cardTop.appendChild(badge);
        cardTop.appendChild(source);

        // Başlık
        const title = document.createElement("h3");
        title.className = "card-title";
        title.textContent = item.title || "";

        // Açıklama
        const desc = document.createElement("p");
        desc.className = "card-desc";
        desc.textContent = item.desc || "";

        topContainer.appendChild(cardTop);
        topContainer.appendChild(title);
        topContainer.appendChild(desc);

        // Alt Bar
        const cardBottom = document.createElement("div");
        cardBottom.className = "card-bottom";

        const metrics = document.createElement("div");
        metrics.className = "card-metrics";

        const ratingSpan = document.createElement("span");
        ratingSpan.className = "meta-star";
        ratingSpan.textContent = `★ ${item.rating || '4.8'}`;

        const yearSpan = document.createElement("span");
        yearSpan.className = "meta-year";
        yearSpan.textContent = `📅 ${item.year || '2026'}`;

        metrics.appendChild(ratingSpan);
        metrics.appendChild(yearSpan);

        const linkBtn = document.createElement("a");
        linkBtn.className = "btn-examine";
        linkBtn.href = sanitizeUrl(item.url);
        linkBtn.target = "_blank";
        linkBtn.rel = "noopener noreferrer";
        linkBtn.textContent = dict.examine;

        cardBottom.appendChild(metrics);
        cardBottom.appendChild(linkBtn);

        card.appendChild(topContainer);
        card.appendChild(cardBottom);
        grid.appendChild(card);
      });

      document.getElementById("loadMoreBtn").style.display = "block";
    }

    /* ========================================================
       6. GEÇMİŞ VE YAŞAM DÖNGÜSÜ
       ======================================================== */
    function renderHistory() {
      const container = document.getElementById("historyChips");
      container.replaceChildren();
      historyList.forEach(query => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = query;
        chip.onclick = () => {
          document.getElementById("searchInput").value = query;
          triggerSearch();
        };
        container.appendChild(chip);
      });
    }

    function addToHistory(q) {
      historyList = historyList.filter(item => item.toLowerCase() !== q.toLowerCase());
      historyList.unshift(q);
      if (historyList.length > 5) historyList.pop();
      renderHistory();
    }

    function clearHistory() {
      historyList = [];
      renderHistory();
    }

    function resetApp() {
      document.getElementById("searchInput").value = "";
      document.getElementById("categoryNavContainer").style.display = "none";
      document.getElementById("resultsGrid").replaceChildren();
      document.getElementById("loadMoreBtn").style.display = "none";
      document.getElementById("statusBox").style.display = "none";
      currentItems = [];
      currentQuery = "";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderHistory();

      try {
        const savedTheme = localStorage.getItem("findex_theme");
        const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === "dark" || (!savedTheme && systemPrefersDark)) {
          document.body.setAttribute("data-theme", "dark");
          document.getElementById("themeBtn").textContent = "☀️";
        }
      } catch(e) {}

      document.getElementById("searchInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") triggerSearch();
      });

      // Sekme listesi kaydırıldığında veya pencere boyutu değiştiğinde yön oklarını güncelle
      const categoryTabs = document.getElementById("categoryTabs");
      if (categoryTabs) {
        categoryTabs.addEventListener("scroll", updateTabScrollButtons, { passive: true });
      }
      window.addEventListener("resize", updateTabScrollButtons);
    });
  </script>
</body>
