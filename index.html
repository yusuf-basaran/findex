<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Açık API'ler ve Google Fontları İçin Güvenli CSP -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    connect-src 'self' 
      https://*.wikipedia.org 
      https://openlibrary.org 
      https://gutendex.com 
      https://api.crossref.org 
      https://api.semanticscholar.org https://api.openalex.org;
    img-src 'self' data: https:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  ">

  <title>Findex — Global Educational Resource Discovery</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- Başlık Çubuğu -->
  <header>
    <a href="#" class="brand" onclick="resetApp()">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      Findex
    </a>

    <div class="header-actions">
      <!-- 7 Dilli Arayüz Seçici -->
      <select id="uiLangSelect" class="glass-select" onchange="changeUILang(this.value)">
        <option value="tr" selected>🇹🇷 TR</option>
        <option value="en">🇬🇧 EN</option>
        <option value="es">🇪🇸 ES</option>
        <option value="de">🇩🇪 DE</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="ru">🇷🇺 RU</option>
        <option value="ar">🇸🇦 AR</option>
      </select>

      <!-- Açık / Koyu Tema Butonu -->
      <button class="btn-icon" id="themeBtn" onclick="toggleTheme()" title="Temayı Değiştir">
        🌙
      </button>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main>
    <section class="hero-section" id="heroArea">
      <div class="hero-badge">
        <span>✨</span> <span id="t_hero_badge">Yeni Nesil Eğitim Keşif Motoru</span>
      </div>
      <h1 class="hero-title" id="t_hero_title">Dünyanın Bilgisine Erişin</h1>
      <p class="hero-subtitle" id="t_hero_subtitle">
        Akademik makaleler, kitaplar, açık dersler, e-kitaplar ve kamusal veritabanlarını tek aramada tarayın.
      </p>

      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Örn: Yapay Zeka, Kuantum Fiziği, Nörobilim..." />
        
        <div class="search-controls">
          <select id="searchLang" class="glass-select" onchange="triggerSearch(true)">
            <option value="tr" selected>TR</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="de">DE</option>
            <option value="fr">FR</option>
            <option value="ru">RU</option>
            <option value="ar">AR</option>
          </select>
          <button class="btn-search" onclick="triggerSearch()">
            <span id="t_search_btn">Keşfet</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Arama Geçmişi / Popüler Konu Çipleri -->
      <div class="history-chips">
        <span class="history-label" id="t_history_label">Keşfet:</span>
        <div id="historyChips" style="display: inline-flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;"></div>
        <button class="chip-clear" id="t_clear_btn" onclick="clearHistory()">Temizle</button>
      </div>
    </section>

    <!-- Sekmeler ve Sağ-Sol Hareket Tuşları -->
    <div class="tabs-nav-container" id="categoryNavContainer" style="display: none;">
      <button class="tabs-scroll-btn" id="tabsScrollLeft" onclick="scrollTabs(-220)" title="Sola Kaydır" aria-label="Sola Kaydır">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="tabs-wrapper" id="categoryTabs">
        <button class="tab-btn active" data-cat="all" onclick="setCategory('all')">
          🔍 <span id="t_tab_all">Tümü</span> <span class="tab-badge" id="count-all">0</span>
        </button>
        <button class="tab-btn" data-cat="wiki" onclick="setCategory('wiki')">
          🌐 <span id="t_tab_wiki">Vikipedi</span> <span class="tab-badge" id="count-wiki">0</span>
        </button>
        <button class="tab-btn" data-cat="papers" onclick="setCategory('papers')">
          📄 <span id="t_tab_papers">Makaleler (CrossRef)</span> <span class="tab-badge" id="count-papers">0</span>
        </button>
        <button class="tab-btn" data-cat="books" onclick="setCategory('books')">
          📚 <span id="t_tab_books">Kitaplar (OpenLibrary)</span> <span class="tab-badge" id="count-books">0</span>
        </button>
        <button class="tab-btn" data-cat="ebooks" onclick="setCategory('ebooks')">
          📖 <span id="t_tab_ebooks">Klasik E-Kitaplar (Gutenberg)</span> <span class="tab-badge" id="count-ebooks">0</span>
        </button>
        <button class="tab-btn" data-cat="courses" onclick="setCategory('courses')">
          🎓 <span id="t_tab_courses">Açık Kurslar & Kaynaklar</span> <span class="tab-badge" id="count-courses">0</span>
        </button>
      </div>

      <button class="tabs-scroll-btn" id="tabsScrollRight" onclick="scrollTabs(220)" title="Sağa Kaydır" aria-label="Sağa Kaydır">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <section class="advanced-filters" aria-label="Gelişmiş arama filtreleri">
      <label>Başlangıç yılı <input id="yearFrom" type="number" min="1800" max="2100" inputmode="numeric" placeholder="2018"></label>
      <label>Bitiş yılı <input id="yearTo" type="number" min="1800" max="2100" inputmode="numeric" placeholder="2026"></label>
      <label class="check-filter"><input id="openAccessOnly" type="checkbox"> Açık erişim</label>
    </section>
    <div class="results-toolbar" id="resultsToolbar" style="display:none;"><span id="resultSummary" aria-live="polite"></span><div class="toolbar-actions"><select id="sortResults" class="toolbar-select" aria-label="Sonuçları sırala" onchange="setSort(this.value)"><option value="relevance">Önerilen sıra</option><option value="title">Başlığa göre</option><option value="newest">En yeni yayın</option></select><button class="saved-filter" id="savedOnlyBtn" type="button" aria-pressed="false" onclick="toggleSavedOnly()">♡ Kaydedilenler <span id="savedCount">0</span></button></div></div>
    <!-- Sonuç ve Durum Alanı -->
    <div id="statusBox" class="status-box" style="display: none;"></div>
    <div class="results-grid" id="resultsGrid"></div>
    <button class="btn-loadmore" id="loadMoreBtn" style="display: none;" onclick="loadMore()">
      <span id="t_load_more">Daha Fazla Sonuç</span>
    </button>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
